name: Cross-repository RVP-1 integration
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AnonRish/ai-2040-plan-a-toolkit
          path: deps/ai-2040-plan-a-toolkit
      - uses: actions/checkout@v4
        with:
          repository: AnonRish/frontier-verify
          path: deps/frontier-verify
      - uses: actions/checkout@v4
        with:
          repository: AnonRish/continental-load-registry
          path: deps/continental-load-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolkit conformance
        working-directory: deps/ai-2040-plan-a-toolkit
        run: |
          python -m pip install -r requirements.txt
          python -m pytest plan_a_protocol/tests embedded_audit/tests verification_lab/tests frame_processor/tests hostile_prover/tests formal/test_reference_model.py benchmarks/test_benchmark.py benchmarks/test_scorecard.py compute_accounting/test_interval_ledger.py gateway/test_policy.py provenance/test_gate.py -q
      - name: Frontier Verify recomputation path
        working-directory: deps/frontier-verify
        run: |
          python -m pip install -e ".[dev,triton,recomputation-research]"
          python -m pytest tests/integration/test_recomputation_v2.py -q
      - name: Track 3 residual bound
        working-directory: deps/continental-load-registry
        run: |
          python -m pip install pytest
          python -m pytest tests/test_track3_bound.py -q
          python track3_bound.py --input data/track3/residual_bound_input.example.json >/tmp/track3-result.json
      - name: Cross-repo contract
        run: |
          python - <<'PY'
          import json, pathlib
          result=json.loads(pathlib.Path("/tmp/track3-result.json").read_text())
          assert result["status"]=="PASS"
          PY
